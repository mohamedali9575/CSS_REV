<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل شرح مشروع CSS: نادي القراءة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --surface:#FBFCFD; --surface-2:#E4E9EF; --ink:#1B2433; --muted:#5A6578;
  --line:#D5DCE4; --accent:#E8A33D; --accent-ink:#1B2433; --teal:#2F6F73; --teal-soft:#D9E6E6;
  --side:#1B2433; --side-ink:#C9D1DC; --side-active:#2A3650;
  --code-bg:#1B2433; --code-ink:#E6EAF0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121822; --surface:#1A2230; --surface-2:#232D3D; --ink:#E6EAF0; --muted:#9AA6B5;
    --line:#2E3A4D; --teal:#7CC4C8; --teal-soft:#1F3436; --side:#0D121A; --side-ink:#AEB8C6; --side-active:#1F2939;
    --code-bg:#0D121A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121822; --surface:#1A2230; --surface-2:#232D3D; --ink:#E6EAF0; --muted:#9AA6B5;
  --line:#2E3A4D; --teal:#7CC4C8; --teal-soft:#1F3436; --side:#0D121A; --side-ink:#AEB8C6; --side-active:#1F2939;
  --code-bg:#0D121A; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;line-height:1.7;font-size:17px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px 1fr;height:100%}
/* ===== الأجندة الجانبية ===== */
.side{background:var(--side);color:var(--side-ink);overflow-y:auto;padding:24px 16px 32px}
.side h1{font-size:20px;color:#F2F4F7;margin:0 8px 4px;line-height:1.4}
.side .sub{font-size:14px;margin:0 8px 20px;color:var(--side-ink)}
.group{font-size:13px;font-weight:700;color:var(--accent);margin:20px 8px 6px}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:right;background:none;border:0;color:var(--side-ink);padding:7px 10px;border-radius:8px;line-height:1.5}
.toc button:hover{background:var(--side-active);color:#F2F4F7}
.toc button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toc .n{font-family:"IBM Plex Mono",monospace;font-size:13px;opacity:.75;min-width:22px}

/* ===== الجزء الرئيسي ===== */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.menu-btn{display:none;background:var(--surface-2);border:0;border-radius:8px;padding:6px 12px;color:var(--ink);font-size:20px}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:15px}
.crumb b{color:var(--ink)}
.count{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--muted)}
.navbtn{background:var(--surface-2);border:0;border-radius:999px;padding:6px 16px;color:var(--ink);font-weight:600}
.navbtn.primary{background:var(--accent);color:var(--accent-ink)}
.navbtn:disabled{opacity:.4;cursor:default}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.scroll{flex:1;overflow-y:auto}
.slide{max-width:1180px;margin:0 auto;padding:36px 32px 48px}
.slide .grp{color:var(--teal);font-weight:700;font-size:15px}
.slide h2{font-size:36px;line-height:1.3;margin:2px 0 16px}
.intro p{margin:0 0 10px;max-width:75ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 6px;font-size:19px;color:var(--teal)}
.card p{margin:0;color:var(--muted)}
button.card{text-align:right;color:var(--ink);font-size:16px}
button.card:hover{border-color:var(--accent)}
.agenda-group{margin-top:24px}
.agenda-group h3{font-size:16px;color:var(--muted);margin:0 0 8px}
.agenda-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.agenda-cards button{display:flex;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:right;color:var(--ink)}
.agenda-cards button:hover{border-color:var(--accent);background:var(--surface-2)}
.agenda-cards .n{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-weight:600}

.rows{display:grid;gap:8px;margin:18px 0}
.row{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px}
.row code{font-family:"IBM Plex Mono",monospace;color:var(--teal);font-weight:600;unicode-bidi:plaintext;text-align:right;font-size:15px}

.steps-list{list-style:none;padding:0;margin:20px 0;display:grid;gap:12px}
.steps-list li{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.steps-list .dot{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--accent);display:flex;justify-content:center;align-items:center;font-weight:700}
:root[data-theme="dark"] .steps-list .dot{background:var(--surface-2)}
table{border-collapse:collapse;width:100%;max-width:760px;margin:20px 0;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{padding:10px 16px;border-bottom:1px solid var(--line);text-align:right}
th{background:var(--surface-2)}
td.d{text-align:center;font-weight:700;width:90px}
tr.total td{font-weight:700;background:var(--teal-soft)}

.map{display:grid;gap:8px;max-width:620px;margin:20px 0;padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--surface)}
.map div{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:0 16px;font-weight:700}
.map code{font-family:"IBM Plex Mono",monospace;direction:ltr}

/* ===== المعمل: كود + نتيجة ===== */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;align-items:start}
.lab.tall{grid-template-columns:1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2)}
.bar .label{flex:1;font-weight:700;font-size:15px}
.tool{border:0;border-radius:8px;padding:5px 14px;font-weight:600;background:var(--surface);color:var(--ink)}
.tool.run{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
textarea.code{display:block;width:100%;min-height:360px;resize:vertical;border:0;margin:0;padding:16px 18px;background:var(--code-bg);color:var(--code-ink);font-family:"IBM Plex Mono",monospace;font-size:14.5px;line-height:1.6;direction:ltr;text-align:left;tab-size:2;white-space:pre}
.lab.tall textarea.code{min-height:420px}
.preview-wrap{overflow:hidden;background:#FFFFFF}
.preview-wrap iframe{display:block;border:0;background:#FFFFFF;transform-origin:top right}
.hint{margin-top:14px;background:var(--teal-soft);border-radius:12px;padding:12px 16px}
.hint b{color:var(--teal)}
details.notes{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 16px}
details.notes summary{cursor:pointer;font-weight:700}
details.notes p{margin:8px 0 0;color:var(--muted)}
.bottom-nav{display:flex;justify-content:space-between;gap:16px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.bottom-nav button{flex:1;max-width:48%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);text-align:right}
.bottom-nav button:hover{border-color:var(--accent)}
.bottom-nav .next{text-align:left}
.bottom-nav small{display:block;color:var(--muted)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.scrim{display:none}

@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;right:0;width:290px;z-index:20;transform:translateX(100%);transition:transform .25s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .menu-btn{display:block}
  .lab{grid-template-columns:1fr}
  .slide{padding:24px 18px 40px}
  .slide h2{font-size:28px}
  .row{grid-template-columns:1fr;gap:2px}
  .topbar{padding:10px 14px}
  .navbtn span{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="الأجندة">
    <h1>مشروع CSS: نادي القراءة</h1>
    <p class="sub">دليل الشرح خطوة بخطوة</p>
    <nav id="toc"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="افتح الأجندة">☰</button>
      <div class="crumb" id="crumb"></div>
      <span class="count" id="count"></span>
      <button class="navbtn" id="prevBtn" aria-label="السابق">→ <span>السابق</span></button>
      <button class="navbtn primary" id="nextBtn" aria-label="التالي"><span>التالي</span> ←</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="scroll" id="scroll"><article class="slide" id="slide"></article></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

uthor\">ابن المقفع<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#6B4E71\"><\/div><h3>حي بن يقظان<\/h3><p class=\"author\">ابن طفيل<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#B5523B\"><\/div><h3>رحلة ابن بطوطة<\/h3><p class=\"author\">ابن بطوطة<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#34507A\"><\/div><h3>عودة الروح<\/h3><p class=\"author\">توفيق الحكيم<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#6E7F3A\"><\/div><h3>ألف ليلة وليلة<\/h3><p class=\"author\">حكايات شعبية<\/p><\/article>\n<\/div>", "code": ".books-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n}\n.book-card {\n  background-color: #FFFFFF;\n  border: 1px solid #DDE3EA;\n  border-radius: 16px;\n  padding: 20px;\n  transition: transform 0.2s, box-shadow 0.2s;\n}\n.book-card:hover {\n  transform: translateY(-6px);\n  box-shadow: 0 12px 24px rgba(27, 36, 51, 0.12);\n}\n.card-cover {\n  height: 100px;\n  border-radius: 10px;\n  margin-bottom: 12px;\n}\n.author {\n  color: #5A6578;\n}", "base": "*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Cairo',Tahoma,sans-serif;color:#1B2433;background:#EEF2F6;line-height:1.7;padding:20px} a{color:inherit;text-decoration:none}", "hint": "غير الـ 3 لـ 2 أو 4. وجرب solid تبقى dashed.", "notes": "أي كارت زيادة بينزل صف جديد من نفسه، فلو زودنا كارت سابع مش محتاجين نكتب ولا سطر CSS."}, {"id": "step6", "group": "الخطوات", "title": "الخطوة 6: دواير الخطوات", "intro": ["أي مربع لو اديته border-radius: 50% يبقى دايرة. وعشان نحط الرقم في النص بالظبط بنستخدم flex."], "rows": [["width = height", "يبقى مربع"], ["border-radius: 50%", "المربع يتحول دايرة"], ["flex + center", "الرقم في نص الدايرة بالظبط"]], "html": "<ol class=\"steps\">\n  <li class=\"step\"><span class=\"step-number\">1<\/span><h3>اعمل حساب<\/h3><\/li>\n  <li class=\"step\">  عرضها 768 بكسل أو أقل.", "استخدم زراير المقاس فوق النتيجة عشان تشوف الصفحة على كمبيوتر وتابلت وموبايل."], "rows": [["max-width: 900px", "تابلت: عمودين"], ["max-width: 768px", "موبايل: عمود واحد"]], "html": "<div class=\"books-grid\">\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#2F6F73\"><\/div><h3>الأيام<\/h3><p class=\"author\">طه حسين<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#E8A33D\"><\/div><h3>كليلة ودمنة<\/h3><p class=\"author\">ابن المقفع<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#6B4E71\"><\/div><h3>حي بن يقظان<\/h3><p class=\"author\">ابن طفيل<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#B5523B\"><\/div><h3>رحلة ابن بطوطة<\/h3><p class=\"author\">ابن بطوطة<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#34507A\"><\/div><h3>عودة الروح<\/h3><p class=\"author\">توفيق الحكيم<\/p><\/article>\n  <article class=\"book-card\"><div class=\"card-cover\" style=\"background:#6E7F3A\"><\/div><h3>ألف ليلة وليلة<\/h3><p class=\"author\">حكايات شعبية<\/p><\/article>\n<\/div>", "widths": true, "code": ".books-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 16px;\n}\n.book-card {\n  background-color: #FFFFFF;\n  border-radius: 16px;\n  padding: 16px;\n}\n.card-cover {\n  height: 80px;\n  border-radius: 10px;\n}\n\n@media (max-width: 900px) {\n  .books-grid {\n    grid-template-columns: repeat(2, 1fr);\n  }\n}\n@media (max-width: 768px) {\n  .books-grid {\n    grid-template-columns: 1fr;\n  }\n}", "base": "*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Cairo',Tahoma,sans-serif;color:#1B2433;background:#EEF2F6;line-height:1.7;padding:20px} a{color:inherit;text-decoration:none}", "hint": "دوس تابلت وبعدين موبايل وشوف عدد العواميد.", "notes": "جوه @media بنكتب نفس الـ selectors بقيم جديدة، والقيم الجديدة بتكسب لأنها مكتوبة بعد. من المتصفح: F12 ثم Ctrl + Shift + M."}, {"id": "full", "group": "الخطوات", "title": "الصفحة كاملة", "intro": ["ده ملف الحل كله بالشرح بتاعه، شغال على الـ HTML بتاع المشروع. عدل أي حاجة وشوف تأثيرها على الصفحة كلها."], "html": "\n\n  \n  <header class=\"navbar\">\n    <a href=\"#home\" class=\"logo\">📚 نادي القراءة<\/a>\n\n    <nav>\n      <ul class=\"nav-links\">\n        <li><a href=\"#home\">الرئيسية<\/a><\/li>\n        <li><a href=\"#books\">الكتب<\/a><\/li>\n        <li><a href=\"#join\">انضم لينا<\/a><\/li>\n      <\/ul>\n    <\/nav>\n\n    \n    <a href=\"login.html\" class=\"btn btn-small\">تسجيل الدخول<\/a>\n  <\/header>\n\n  \n  <section class=\"hero\" id=\"home\">\n    <div class=\"hero-text\">\n      <h1>كل أسبوع كتاب جديد، وكل كتاب حكاية<\/h1>\n      <p>نادي لطلبة المدارس بيقروا نفس الكتاب في نفس الأسبوع، ويتقابلوا يوم الجمعة يتناقشوا في اللي قروه.<\/p>\n      <a href=\"#join\" class=\"btn\">اشترك مجانا<\/a>\n    <\/div>\n\n    <div class=\"book-of-week\">\n      \n      <div class=\"book-cover\">\n        <h2>حي بن يقظان<\/h2>\n        <p>ابن طفيل<\/p>\n      <\/div>\n      <p class=\"book-label\">كتاب الأسبوع ده<\/p>\n    <\/div>\n  <\/section>\n\n  \n  <section class=\"section\" id=\"books\">\n    <h2 class=\"section-title\">كتب الشهر<\/h2>\n    <p class=\"section-subtitle\">اختار الكتاب اللي يعجبك وابدأ اقرا مع المجموعة<\/p>\n\n    <div class=\"books-grid\">\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-1\"><\/div>\n        <h3>الأيام<\/h3>\n        <p class=\"author\">طه حسين<\/p>\n        <span class=\"level\">متوسط<\/span>\n      <\/article>\n\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-2\"><\/div>\n        <h3>كليلة ودمنة<\/h3>\n        <p class=\"author\">ابن المقفع<\/p>\n        <span class=\"level\">سهل<\/span>\n      <\/article>\n\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-3\"><\/div>\n        <h3>حي بن يقظان<\/h3>\n        <p class=\"author\">ابن طفيل<\/p>\n        <span class=\"level\">متوسط<\/span>\n      <\/article>\n\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-4\"><\/div>\n        <h3>رحلة ابن بطوطة<\/h3>\n        <p class=\"author\">ابن بطوطة<\/p>\n        <span class=\"level\">صعب<\/span>\n      <\/article>\n\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-5\"><\/div>\n        <h3>عودة الروح<\/h3>\n        <p class=\"author\">توفيق الحكيم<\/p>\n        <span class=\"level\">متوسط<\/span>\n      <\/article>\n\n      <article class=\"book-card\">\n        <div class=\"card-cover cover-6\"><\/div>\n        <h3>ألف ليلة وليلة<\/h3>\n        <p class=\"author\">حكايات شعبية<\/p>\n        <span class=\"level\">سهل<\/span>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  \n  <section class=\"section\" id=\"join\">\n    <h2 class=\"section-title\">تنضم إزاي؟<\/h2>\n    <p class=\"section-subtitle\">3 خطوات بس<\/p>\n\n    <ol class=\"steps\">\n      <li class=\"step\">\n        <span class=\"step-number\">1<\/span>\n        <h3>اعمل حساب<\/h3>\n        <p>سجل باسمك وإيميلك من صفحة تسجيل الدخول.<\/p>\n      <\/li>\n      <li class=\"step\">\n        <span class=\"step-number\">2<\/span>\n        <h3>اختار كتاب<\/h3>\n        <p>اختار كتاب من كتب الشهر وابدأ تقرا.<\/p>\n      <\/li>\n      <li class=\"step\">\n        <span class=\"step-number\">3<\/span>\n        <h3>تعالى الجمعة<\/h3>\n        <p>اتكلم عن اللي قريته مع باقي الأعضاء.<\/p>\n      <\/li>\n    <\/ol>\n\n    <div class=\"join-action\">\n      <a href=\"login.html\" class=\"btn\">ابدأ دلوقتي<\/a>\n    <\/div>\n  <\/section>\n\n  \n  <footer class=\"footer\">\n    <p>نادي القراءة © 2026 — اتعمل بإيد طالب بيتعلم CSS<\/p>\n  <\/footer>\n\n", "code": "/* =========================================================\n   مشروع: صفحة نادي القراءة  (ملف الحل)\n   الملف ده فيه كل الشكل بتاع الصفحة.\n   أي كلام مكتوب بين علامة البداية وعلامة النهاية دي اسمه \"تعليق\"\n   والمتصفح بيتجاهله، يعني ده شرح للبني آدم بس.\n\n   شكل أي قاعدة في CSS:\n   الـ selector { الـ property: القيمة; }\n   مثال:  h1 { color: red; }  = \"خلي لون كل العناوين h1 أحمر\"\n   ========================================================= */\n\n\n/* =========================================================\n   الخطوة 1: الأساسيات (بتأثر على الصفحة كلها)\n   ========================================================= */\n\n/* النجمة * معناها \"كل العناصر في الصفحة\" */\n* {\n  margin: 0;               /* نشيل المسافات الخارجية اللي المتصفح بيحطها لوحده */\n  padding: 0;              /* نشيل المسافات الداخلية اللي المتصفح بيحطها لوحده */\n  box-sizing: border-box;  /* العرض اللي بنكتبه يشمل الـ padding والـ border، فالحسابات تبقى أسهل */\n}\n\nbody {\n  font-family: \"Cairo\", Tahoma, sans-serif; /* نوع الخط، ولو Cairo ما اتحملش يستخدم Tahoma */\n  background-color: #EEF2F6;                /* لون خلفية الصفحة كلها (رمادي مزرق فاتح) */\n  color: #1B2433;                           /* لون الكلام الأساسي (كحلي غامق) */\n  line-height: 1.7;                         /* المسافة بين السطور = 1.7 من حجم الخط، القراءة تبقى مريحة */\n}\n\na {\n  color: inherit;          /* inherit = اللينك ياخد نفس لون الكلام اللي حواليه بدل الأزرق */\n  text-decoration: none;   /* نشيل الخط اللي تحت اللينك */\n}\n\n\n/* =========================================================\n   الخطوة 2: النافيجيشن بار\n   ========================================================= */\n\n.navbar {                           /* النقطة . قبل الاسم = class */\n  display: flex;                    /* نخلي العناصر اللي جواه جنب بعض في صف واحد */\n  justify-content: space-between;   /* نوزعهم: واحد في الأول، واحد في الآخر، والباقي في النص */\n  align-items: center;              /* نسنترهم رأسيا (من فوق لتحت) */\n  padding: 16px 48px;               /* 16 بكسل من فوق وتحت، 48 من اليمين والشمال */\n  background-color: #1B2433;        /* خلفية كحلي */\n  color: #FFFFFF;                   /* الكلام أبيض */\n  position: sticky;                 /* البار يفضل ظاهر وانت بتنزل في الصفحة */\n  top: 0;                           /* ويلزق في أعلى الشاشة بالظبط */\n  z-index: 10;                      /* يبقى فوق أي حاجة تانية وهو لازق */\n}\n\n.logo {\n  font-size: 22px;      /* حجم الخط */\n  font-weight: 700;     /* تخانة الخط: 400 عادي، 700 تخين (bold) */\n}\n\n.nav-links {\n  display: flex;        /* اللينكات جنب بعض بدل ما تبقى تحت بعض */\n  gap: 32px;            /* مسافة 32 بكسل بين كل لينك والتاني */\n  list-style: none;     /* نشيل النقط أو الأرقام اللي قبل كل عنصر في القايمة */\n}\n\n.nav-links a {                  /* معناها: أي لينك a موجود جوه .nav-links */\n  opacity: 0.8;                 /* شفافية خفيفة: 1 ظاهر كامل، 0 مختفي خالص */\n  transition: opacity 0.2s, color 0.2s;   /* أي تغيير يحصل بنعومة في 0.2 ثانية بدل ما يقلب فجأة */\n}\n\n.nav-links a:hover {            /* :hover = لما الماوس يقف على اللينك */\n  opacity: 1;\n  color: #E8A33D;               /* يقلب برتقاني دهبي */\n}\n\n\n/* =========================================================\n   الخطوة 3: الأزرار\n   ========================================================= */\n\n.btn {\n  display: inline-block;        /* يفضل في نفس السطر بس يقبل padding من كل الجهات */\n  background-color: #E8A33D;    /* خلفية برتقاني دهبي */\n  color: #1B2433;               /* الكلام كحلي */\n  font-weight: 700;\n  padding: 12px 28px;           /* حجم الزرار بييجي من المسافة الداخلية */\n  border-radius: 999px;         /* رقم كبير = الأطراف مدورة على الآخر (شكل كبسولة) */\n  transition: transform 0.2s, background-color 0.2s;\n}\n\n.btn:hover {\n  background-color: #F2B85C;    /* لون أفتح شوية */\n  transform: translateY(-3px);  /* الزرار يطلع لفوق 3 بكسل كأنه بيترفع */\n}\n\n/* class تانية بتتحط على نفس الزرار عشان نصغره (العنصر ممكن ياخد أكتر من class) */\n.btn-small {\n  padding: 8px 20px;\n  font-size: 14px;\n}\n\n\n/* =========================================================\n   الخطوة 4: الجزء الرئيسي (Hero)\n   ========================================================= */\n\n.hero {\n  display: flex;          /* الكلام والكتاب جنب بعض */\n  align-items: center;    /* متسنترين رأسيا */\n  gap: 64px;              /* مسافة بينهم */\n  max-width: 1100px;      /* أقصى عرض، عشان الكلام ما يتمطش أوي على الشاشات الكبيرة */\n  margin: 0 auto;         /* 0 فوق وتحت، auto يمين وشمال = المحتوى يتسنتر في نص الصفحة */\n  padding: 80px 24px;\n}\n\n.hero-text {\n  flex: 1;                /* ياخد كل المساحة الفاضية اللي فاضلة */\n}\n\n.hero h1 {                /* أي h1 جوه .hero */\n  font-size: 44px;\n  line-height: 1.3;\n  margin-bottom: 16px;    /* مسافة تحت العنوان */\n}\n\n.hero p {\n  font-size: 18px;\n  max-width: 520px;       /* الفقرة ما تعديش 520 بكسل عرض */\n  margin-bottom: 28px;\n}\n\n.book-of-week {\n  text-align: center;     /* الكلام اللي جواه في النص */\n}\n\n/* غلاف كتاب معمول من div بس */\n.book-cover {\n  width: 200px;\n  height: 280px;\n  background-color: #2F6F73;           /* أخضر مزرق */\n  color: #FFFFFF;\n  padding: 24px;\n  border-radius: 12px;\n  border-right: 12px solid #24575A;    /* خط تخين على اليمين شبه كعب الكتاب */\n  display: flex;\n  flex-direction: column;              /* المرة دي العناصر تحت بعض مش جنب بعض */\n  justify-content: space-between;      /* العنوان فوق واسم الكاتب تحت */\n  box-shadow: 0 20px 40px rgba(27, 36, 51, 0.3);  /* ظل: يمين/شمال 0، لتحت 20، مدى التمويه 40، اللون شفاف */\n  transform: rotate(-4deg);            /* نميل الكتاب 4 درجات */\n  margin-bottom: 24px;\n}\n\n.book-cover h2 {\n  font-size: 26px;\n  line-height: 1.4;\n}\n\n.book-label {\n  font-size: 14px;\n  color: #5A6578;          /* رمادي، عشان يبقى أقل أهمية من باقي الكلام */\n}\n\n\n/* =========================================================\n   الخطوة 5: الأقسام وكروت الكتب\n   ========================================================= */\n\n/* class عامة لأي قسم في الصفحة (بنستخدمها مرتين) */\n.section {\n  max-width: 1100px;\n  margin: 0 auto;\n  padding: 64px 24px;\n}\n\n.section-title {\n  font-size: 32 /* ---------- الأجندة ---------- */
function buildToc(){

  f.style.height = (H / s) + 'px';
  f.style.transform = `scale(${s})`;
  f.style.marginRight = s < 1 ? '0' : ((avail - W) / 2) + 'px';
  w.style.height = H + 'px';
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('اتنسخ ✓'); }
  catch(e){
    const ta = $('#code'); ta.focus(); ta.select();
    try { document.execCommand('copy'); toast('اتنسخ ✓'); } catch(_) { toast('علم على الكود واضغط Ctrl + C'); }
  }
}
let tt;
function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600); }

/* ---------- التنقل ---------- */
function go(i){
  if (i < 0 || i >= T.length) return;
  cur = i; render(); closeMenu();
  try { history.replaceState(null, '', '#' + T[i].id); } catch(e){}
}
function closeMenu(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#prevBtn').onclick = () => go(cur-1);
$('#nextBtn').onclick = () => go(cur+1);
$('#menuBtn').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeMenu;
$('#slide').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea, input')) return;
  if (e.key === 'ArrowLeft') go(cur+1);   // الصفحة عربي: الشمال = التالي
  if (e.key === 'ArrowRight') go(cur-1);
});
window.addEventListener('resize', fit);

buildToc();
const start = T.findIndex(t => '#' + t.id === location.hash);
go(start >= 0 ? start : 0);
</script>
